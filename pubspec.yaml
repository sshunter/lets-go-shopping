name: lgs_tooling
description: >-
  Repo-level dev tooling for lets-go-shopping. Hosts the dependency-maintenance
  CLI (`dart run tool/deps.dart`) used to report and apply within-constraint pub
  upgrades across the shared_core / android_app / ios_app monorepo.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  args: ^2.5.0
  yaml: ^3.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0