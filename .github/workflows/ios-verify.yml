name: iOS Compilation Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Automatically cancel older running builds on the same branch if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Natively caches Flutter SDK artifacts and pub packages automatically
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
          cache-key: "flutter-:channel:-:version:-${{ hashFiles('**/pubspec.yaml') }}"

      - name: Install Dependencies (Shared Core)
        run: |
          cd shared_core
          flutter pub get

      - name: Install Dependencies (iOS App)
        run: |
          cd ios_app
          flutter pub get

      # Build production AOT binaries (Swift Package Manager dependencies resolve automatically here)
      - name: Build iOS Release (No Code Sign)
        run: |
          cd ios_app
          flutter build ios --no-codesign --release
