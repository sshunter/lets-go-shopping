name: iOS Compilation Gate

on:
  push:
    branches: [main]
    paths:
      - "shared_core/**"
      - "ios_app/**"
  pull_request:
    branches: [main]
    paths:
      - "shared_core/**"
      - "ios_app/**"
  workflow_dispatch: # Allows you to manually trigger this run from the GitHub UI

# Automatically cancel older running builds on the same branch if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # Removed the custom cache-key line to let the action natively manage SDK and Pub caches independently
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies (Shared Core)
        run: |
          cd shared_core
          flutter pub get

      - name: Install Dependencies (iOS App)
        run: |
          cd ios_app
          flutter pub get

      # Build production AOT binaries (Swift Package Manager dependencies resolve automatically here)
      - name: Build iOS Release (No Code Sign)
        run: |
          cd ios_app
          flutter build ios --no-codesign --release
